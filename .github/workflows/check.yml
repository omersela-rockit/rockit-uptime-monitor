name: Uptime monitor (5-minute loop)

# The cadence is NOT left to GitHub's `schedule:` trigger, which is unreliable
# (measured 5-13 hour gaps). Instead one job stays alive for ~5.5 hours running a
# check every 5 minutes itself, then hands off to a fresh run.
#
# There is deliberately no `schedule:` here. It used to have one as a safety net,
# but firing it into this concurrency group was what actually BROKE the chain:
# GitHub keeps only one pending run per group, so each scheduled run cancelled
# the previous pending one -- including the handoff run. That produced an endless
# cancel cascade where nothing ever started (13h and 5.5h outages on Aug 6-7).
# Restarts are now handled by supervisor.yml, which stays outside this group.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install script dependencies
        run: npm ci --prefix scripts

      - name: Check every 5 minutes for ~5.5 hours
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          git config user.name "rockit-uptime-bot"
          git config user.email "actions@users.noreply.github.com"

          END=$(( $(date +%s) + 5*3600 + 1800 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            START=$(date +%s)

            node scripts/check-all.js || echo "check failed, continuing loop"

            git add status.json heartbeat.json docs/index.html 2>/dev/null || true
            if ! git diff --staged --quiet; then
              git commit -q -m "Update status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git pull --rebase -q origin master || true
              git push -q || echo "push failed, will retry next cycle"
            fi

            # Sleep whatever is left of the 5-minute window.
            ELAPSED=$(( $(date +%s) - START ))
            REMAIN=$(( 300 - ELAPSED ))
            [ "$REMAIN" -gt 0 ] && sleep "$REMAIN"
          done

      - name: Hand off to a fresh run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DISPATCH_TOKEN not set -- relying on the scheduled safety net to restart the chain."
            exit 0
          fi
          gh workflow run check.yml --repo ${{ github.repository }} --ref master
