name: Hourly uptime check

on:
  # GitHub's own schedule trigger is unreliable in practice (observed gaps of
  # 5-10 hours instead of firing hourly as configured). Running every 15
  # minutes instead of once an hour gives it far more chances to actually
  # fire, so real-world gaps stay small even though most of these attempts
  # get silently dropped by GitHub. No external service, no new account.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: uptime-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install script dependencies
        run: npm ci --prefix scripts

      - name: Run checks
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: node scripts/check-all.js

      - name: Commit updated status
        run: |
          git config user.name "rockit-uptime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          git diff --staged --quiet || git commit -m "Update status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
