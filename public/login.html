<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Login — Rock It Uptime Monitor</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M7 18h4l2.5-8L18 25l2.5-8H25' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="center-screen">
  <form class="card login-card" id="loginForm">
    <div class="login-brand">
      <div class="mark">
        <svg width="20" height="20" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 18h4l2.5-8L18 25l2.5-8H25" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1 class="gradient-text">Rock It Uptime Monitor</h1>
        <div class="sub">Keep an eye on your sites</div>
      </div>
    </div>
    <label>Username</label>
    <input type="text" name="username" autocomplete="username" required />
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password" required />
    <div class="error" id="err"></div>
    <button type="submit" class="btn-block">Log in</button>
    <div id="googleDivider" class="divider hidden">or</div>
    <a id="googleBtn" href="/auth/google" class="google-btn hidden">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.2 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.2 29.6 4 24 4c-7.6 0-14.1 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35 26.9 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.6 5.1C9.9 39.6 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.6C41.4 36.5 44 30.7 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      Sign in with Google
    </a>
  </form>
  <footer class="app-footer">Powered by <span class="brand-name">RockIt AI Technologies</span></footer>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const err = document.getElementById('err');
  err.textContent = '';
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: form.username.value, password: form.password.value }),
  });
  if (res.ok) {
    window.location.href = '/';
  } else {
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || 'Login failed';
  }
});

const errorMessages = {
  google_cancelled: 'Google sign-in was cancelled.',
  google_unauthorized: 'That Google account is not authorized for this app.',
  google_failed: 'Google sign-in failed. Try again.',
};
const params = new URLSearchParams(window.location.search);
if (params.get('error')) {
  document.getElementById('err').textContent = errorMessages[params.get('error')] || 'Login failed';
}

fetch('/api/google-login-available')
  .then((r) => r.json())
  .then((data) => {
    if (data.available) {
      document.getElementById('googleDivider').classList.remove('hidden');
      document.getElementById('googleBtn').classList.remove('hidden');
    }
  })
  .catch(() => {});
</script>
</body>
</html>
